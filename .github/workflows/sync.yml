name: Mirror Gitee Repo
on:
  workflow_dispatch: # Allows manual trigger from the browser interface

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Destination Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Push from Gitee
        run: |
          # 1. Link to the original Gitee repository
          git remote add gitee https://gitee.com
          
          # 2. Fetch the specific release branch and all project tags
          git fetch gitee release/AC79NN_SDK_V1.2.0 --tags
          
          # 3. Create a local tracking branch from Gitee's release branch
          git checkout -b release/AC79NN_SDK_V1.2.0 gitee/release/AC79NN_SDK_V1.2.0
          
          # 4. Force push the branch and tags over to your GitHub repository
          git push origin release/AC79NN_SDK_V1.2.0 --force --tags
